listen = "100.105.221.115:7878"
state_dir = "state"
# Older main builds stay this long, so a check on a base main just moved past still runs on it.
keep_hours = 2

[repos.tempo]
url = "https://github.com/tempoxyz/tempo"
clippy = "RUSTFLAGS='-D warnings' cargo +nightly-2026-10-31 clippy --locked --message-format=json"
build = "RUSTFLAGS='-D warnings' cargo +nightly-2026-10-31 build --locked"
jobs = [
  { name = "clippy-runtime", cmd = "RUSTFLAGS='-D warnings' cargo +nightly-2026-10-31 clippy --workspace --lib --bins --all-features --locked --message-format=json --" },
  { name = "clippy-tests", cmd = "RUSTFLAGS='-D warnings' cargo +nightly-2026-10-31 clippy --workspace --tests --all-features --locked --message-format=json --" },
  { name = "clippy-benches", benches_only = true, cmd = "RUSTFLAGS='-D warnings' cargo +nightly-2026-10-31 clippy --workspace --benches --examples --all-features --locked --message-format=json --" },
  { name = "slapslop", cmd = 'cargo-slapslop run "$PWD" --diff HEAD~1 --all-lints --disable decorative_comment_divider,narrator_comment', on_main = 'cargo-slapslop run "$PWD" --all-lints --disable decorative_comment_divider,narrator_comment', slapslop = true },
  { name = "fmt", cmd = "cargo +nightly fmt --all --check", on_patch = "cargo +nightly fmt --check {touched}" },
  { name = "test", cmd = "RUSTFLAGS='-D warnings' cargo +nightly-2026-10-31 nextest run --locked --no-fail-fast --workspace -E 'package({package})' {tests}", on_main = "RUSTFLAGS='-D warnings' cargo +nightly-2026-10-31 test --locked --workspace --no-run", test = true },
]

[repos.reth]
url = "https://github.com/paradigmxyz/reth"
clippy = "RUSTFLAGS='-D warnings' cargo +nightly-2026-10-31 clippy --locked --message-format=json"
build = "RUSTFLAGS='-D warnings' cargo +nightly-2026-10-31 build --locked"
jobs = [
  { name = "clippy-all-features", cmd = "RUSTFLAGS='-D warnings' cargo +nightly-2026-10-31 clippy --workspace --lib --examples --tests --benches --all-features --locked --message-format=json --" },
  { name = "clippy", cmd = "RUSTFLAGS='-D warnings' cargo +nightly-2026-10-31 clippy --workspace --lib --examples --tests --benches --locked --message-format=json --" },
  { name = "slapslop", cmd = 'cargo-slapslop run "$PWD" --diff HEAD~1 --all-lints --disable decorative_comment_divider,narrator_comment', on_main = 'cargo-slapslop run "$PWD" --all-lints --disable decorative_comment_divider,narrator_comment', slapslop = true },
  { name = "fmt", cmd = "cargo +nightly fmt --all --check", on_patch = "cargo +nightly fmt --check {touched}" },
  { name = "test", cmd = "RUSTFLAGS='-D warnings' cargo +nightly-2026-10-31 nextest run --locked --no-fail-fast --workspace -E 'package({package})' {tests}", on_main = "RUSTFLAGS='-D warnings' cargo +nightly-2026-10-31 test --locked --workspace --no-run", test = true },
]

[repos.slapslop]
url = "https://github.com/tempoxyz/slapslop"
clippy = "cargo clippy --locked --message-format=json"
build = "cargo build --locked"
jobs = [
  { name = "clippy", cmd = "cargo clippy --locked --workspace --lib --bins --tests --message-format=json -- -D warnings", fix = "cargo clippy --locked --workspace --fix --allow-dirty --allow-no-vcs" },
  { name = "clippy-non-test", bins_only = true, cmd = "cargo clippy --locked --workspace --lib --bins --all-features --message-format=json -- -D clippy::unwrap_used -D clippy::infinite_loop -D clippy::needless_pass_by_value -D dead_code_pub_in_binary" },
  { name = "slapslop", cmd = 'cargo-slapslop run "$PWD" --diff HEAD~1 --all-lints --enable no_docs --disable decorative_comment_divider,narrator_comment', on_main = 'cargo-slapslop run "$PWD" --all-lints --enable no_docs --disable decorative_comment_divider,narrator_comment', slapslop = true },
  { name = "fmt", cmd = "cargo fmt --all --check", on_patch = "cargo fmt --check {touched}" },
  { name = "test", cmd = "cargo nextest run --locked --no-fail-fast --workspace -E 'package({package})' {tests}", on_main = "cargo test --locked --workspace --no-run", test = true },
]

[repos.warmd]
url = "https://github.com/joshieDo/warmd"
clippy = "cargo clippy --locked --message-format=json"
build = "cargo build --locked"
jobs = [
  { name = "clippy", cmd = "cargo clippy --all-targets --all-features --locked --message-format=json --", fix = "cargo clippy --all-targets --all-features --locked --fix --allow-dirty --allow-no-vcs" },
  { name = "clippy-non-test", bins_only = true, cmd = "cargo clippy --bins --all-features --locked --message-format=json -- -D clippy::unwrap_used -D clippy::infinite_loop -D clippy::needless_pass_by_value -D dead_code_pub_in_binary" },
  { name = "slapslop", cmd = 'cargo-slapslop run "$PWD" --diff HEAD~1', on_main = 'cargo-slapslop run "$PWD"', args = "--all-lints --enable no_docs", slapslop = true },
  { name = "fmt", cmd = "cargo fmt --check", on_patch = "cargo fmt --check {touched}" },
  { name = "test", cmd = "cargo nextest run --locked --no-fail-fast --workspace -E 'package({package})' {tests}", on_main = "cargo test --locked --no-run", test = true },
]

