listen = "100.105.221.115:7878"
state_dir = "state"

[repos.tempo]
url = "https://github.com/tempoxyz/tempo"
clippy = "RUSTFLAGS='-D warnings' cargo +nightly-2026-10-31 clippy --locked --message-format=json"
jobs = [
  { name = "clippy-runtime", cmd = "RUSTFLAGS='-D warnings' cargo +nightly-2026-10-31 clippy --workspace --lib --bins --all-features --locked --message-format=json --" },
  { name = "clippy-tests", cmd = "RUSTFLAGS='-D warnings' cargo +nightly-2026-10-31 clippy --workspace --tests --all-features --locked --message-format=json --" },
  { name = "clippy-benches", cmd = "RUSTFLAGS='-D warnings' cargo +nightly-2026-10-31 clippy --workspace --benches --examples --all-features --locked --message-format=json --" },
  { name = "slapslop-warm", cmd = 'cargo-slapslop run "$PWD" --all-lints --disable decorative_comment_divider,narrator_comment', slapslop = true, warm_only = true },
  { name = "fmt", cmd = "cargo +nightly fmt --all --check", on_patch = "cargo +nightly fmt --check {packages}" },
]

[repos.reth]
url = "https://github.com/paradigmxyz/reth"
clippy = "RUSTFLAGS='-D warnings' cargo +nightly-2026-10-31 clippy --locked --message-format=json"
jobs = [
  { name = "clippy-all-features", cmd = "RUSTFLAGS='-D warnings' cargo +nightly-2026-10-31 clippy --workspace --lib --examples --tests --benches --all-features --locked --message-format=json --" },
  { name = "clippy", cmd = "RUSTFLAGS='-D warnings' cargo +nightly-2026-10-31 clippy --workspace --lib --examples --tests --benches --locked --message-format=json --" },
  { name = "slapslop-warm", cmd = 'cargo-slapslop run "$PWD" --all-lints --disable decorative_comment_divider,narrator_comment', slapslop = true, warm_only = true },
  { name = "fmt", cmd = "cargo +nightly fmt --all --check", on_patch = "cargo +nightly fmt --check {packages}" },
]

[repos.slapslop]
url = "https://github.com/tempoxyz/slapslop"
clippy = "cargo clippy --locked --message-format=json"
jobs = [
  { name = "clippy", cmd = "cargo clippy --locked --workspace --lib --bins --tests --message-format=json -- -D warnings", fix = "cargo clippy --locked --workspace --fix --allow-dirty --allow-no-vcs" },
  { name = "clippy-non-test", cmd = "cargo clippy --locked --workspace --lib --bins --all-features --message-format=json -- -D clippy::unwrap_used -D clippy::infinite_loop -D clippy::needless_pass_by_value -D dead_code_pub_in_binary" },
  { name = "slapslop", cmd = 'cargo-slapslop run "$PWD"', on_patch = 'cargo-slapslop run "$PWD" --diff HEAD~1', slapslop = true },
  { name = "fmt", cmd = "cargo fmt --all --check", on_patch = "cargo fmt --check {packages}" },
]

[repos.warmd]
url = "https://github.com/joshieDo/warmd"
clippy = "cargo clippy --locked --message-format=json"
jobs = [
  { name = "clippy", cmd = "cargo clippy --all-targets --all-features --locked --message-format=json --", fix = "cargo clippy --all-targets --all-features --locked --fix --allow-dirty --allow-no-vcs" },
  { name = "clippy-non-test", cmd = "cargo clippy --bins --all-features --locked --message-format=json -- -D clippy::unwrap_used -D clippy::infinite_loop -D clippy::needless_pass_by_value -D dead_code_pub_in_binary" },
  { name = "slapslop", cmd = 'cargo-slapslop run "$PWD"', on_patch = 'cargo-slapslop run "$PWD" --diff HEAD~1', args = "--all-lints", slapslop = true },
  { name = "fmt", cmd = "cargo fmt --check", on_patch = "cargo fmt --check {packages}" },
]

[repos.evm2]
url = "https://github.com/alloy-rs/evm2"
clippy = "RUSTFLAGS='-Dwarnings' LLVM_SYS_231_PREFIX=/usr/lib/llvm-23 LLVM_CONFIG_PATH=/usr/lib/llvm-23/bin/llvm-config cargo +nightly-2026-10-31 clippy --message-format=json"
jobs = [
  { name = "clippy", cmd = "RUSTFLAGS='-Dwarnings' LLVM_SYS_231_PREFIX=/usr/lib/llvm-23 LLVM_CONFIG_PATH=/usr/lib/llvm-23/bin/llvm-config cargo +nightly-2026-10-31 clippy --workspace --all-targets --all-features --message-format=json --" },
  { name = "slapslop-warm", cmd = 'cargo-slapslop run "$PWD" --all-lints --disable decorative_comment_divider,narrator_comment', slapslop = true, warm_only = true },
  { name = "fmt", cmd = "cargo +nightly fmt --all --check", on_patch = "cargo +nightly fmt --check {packages}" },
]

[repos.solar]
url = "https://github.com/paradigmxyz/solar"
clippy = "RUSTFLAGS='-Dwarnings' LLVM_SYS_221_PREFIX=/usr/lib/llvm-22 LLVM_CONFIG_PATH=/usr/lib/llvm-22/bin/llvm-config cargo +nightly clippy --message-format=json"
jobs = [
  { name = "clippy", cmd = "RUSTFLAGS='-Dwarnings' LLVM_SYS_221_PREFIX=/usr/lib/llvm-22 LLVM_CONFIG_PATH=/usr/lib/llvm-22/bin/llvm-config cargo +nightly clippy --workspace --all-targets --message-format=json --" },
  { name = "slapslop-warm", cmd = 'LLVM_SYS_221_PREFIX=/usr/lib/llvm-22 LLVM_CONFIG_PATH=/usr/lib/llvm-22/bin/llvm-config cargo-slapslop run "$PWD" --all-lints --disable decorative_comment_divider,narrator_comment', slapslop = true, warm_only = true },
  { name = "fmt", cmd = "cargo +nightly fmt --all --check", on_patch = "cargo +nightly fmt --check {packages}" },
]

[repos.alloy]
url = "https://github.com/alloy-rs/alloy"
clippy = "RUSTFLAGS='-Dwarnings' cargo +stable clippy --locked --message-format=json"
jobs = [
  { name = "clippy", cmd = "RUSTFLAGS='-Dwarnings' cargo +stable clippy --locked --workspace --all-targets --all-features --message-format=json --" },
  { name = "slapslop-warm", cmd = 'cargo-slapslop run "$PWD" --all-lints --disable decorative_comment_divider,narrator_comment', slapslop = true, warm_only = true },
  { name = "fmt", cmd = "cargo +nightly fmt --all --check", on_patch = "cargo +nightly fmt --check {packages}" },
]
