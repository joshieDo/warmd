<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>warmd</title>
<style>
:root {
  --bg: #f4f4f4; --surface: #fff; --line: rgba(0,0,0,.08); --text: #000; --muted: rgba(0,0,0,.55); --faint: rgba(0,0,0,.35);
  --fill: rgba(0,0,0,.06); --positive: #138a3e; --warning: #c56a00; --negative: #d12f2f;
  font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-feature-settings: "tnum";
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #000; --surface: #111; --line: rgba(255,255,255,.1); --text: #fff; --muted: rgba(255,255,255,.6); --faint: rgba(255,255,255,.35); --fill: rgba(255,255,255,.08); --positive: #3ccf6e; --warning: #ffa23a; --negative: #ff5c5c; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-size: 13px; }
main { max-width: 1100px; margin: 0 auto; padding: 32px 20px; display: grid; gap: 16px; }
header { display: flex; align-items: baseline; justify-content: space-between; }
h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
h2 { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.stat .value { font-size: 24px; font-weight: 600; letter-spacing: -.02em; }
.stat .sub { color: var(--muted); margin-top: 2px; }
.bar { height: 4px; background: var(--fill); border-radius: 2px; margin-top: 10px; overflow: hidden; }
.bar > div { height: 100%; background: var(--text); }
svg { width: 100%; height: 48px; display: block; margin-top: 10px; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 500; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
code { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; }
.muted { color: var(--muted); }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; background: var(--faint); }
.ready, .ok { background: var(--positive); } .refreshing, .running, .queued { background: var(--warning); } .failed { background: var(--negative); }
.cores { display: flex; gap: 2px; height: 24px; margin-top: 10px; align-items: flex-end; }
.cores > div { flex: 1; height: 100%; background: var(--fill); border-radius: 1px; display: flex; align-items: flex-end; }
.cores > div > div { width: 100%; background: var(--text); border-radius: 1px; }
.chip { display: inline-block; padding: 1px 6px; border-radius: 6px; background: var(--fill); margin: 0 4px 4px 0; }
tr.click { cursor: pointer; } a { color: inherit; } a:hover code { text-decoration: underline; } tr.click:hover td { background: var(--fill); }
#modal { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; }
#modal[hidden] { display: none; }
.sheet { width: 80vw; height: 80vh; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px 24px; overflow: auto; }
.sheet header { margin-bottom: 16px; }
.sheet button { background: none; border: 0; color: var(--muted); font-size: 16px; cursor: pointer; }
.tree, .tree ul { list-style: none; margin: 0; padding-left: 18px; }
.tree { padding-left: 0; }
.tree li { position: relative; padding: 4px 0 4px 14px; }
.tree ul li::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; border-left: 1px solid var(--line); }
.tree ul li::after { content: ""; position: absolute; left: 0; top: 13px; width: 10px; border-top: 1px solid var(--line); }
.node { font-weight: 500; }
.parts { margin: 4px 0 0; font-size: 12px; }
.detail section { margin-bottom: 18px; } .kv { display: grid; grid-template-columns: 180px 1fr; gap: 12px; padding: 5px 0; border-bottom: 1px solid var(--line); } .phase { display: grid; grid-template-columns: 180px 1fr 60px; gap: 12px; align-items: center; padding: 3px 0; } .phase .bar { margin-top: 0; }
.tl { margin: 4px 0 10px; } .tl-row { display: grid; grid-template-columns: 72px 1fr; gap: 10px; align-items: center; margin: 6px 0; } .tl-name { font-size: 11px; color: var(--muted); text-align: right; text-transform: uppercase; letter-spacing: .04em; } .tl-track { position: relative; height: 26px; background: var(--fill); border-radius: 6px; overflow: hidden; } .tl-seg { position: absolute; top: 3px; bottom: 3px; margin-left: 1px; border-radius: 4px; display: flex; align-items: center; overflow: hidden; } .tl-seg span { padding: 0 8px; font-size: 11px; font-weight: 500; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .tl-ticks { position: relative; height: 14px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); } .tl-ticks span { position: absolute; top: 2px; transform: translateX(-50%); } .tl-ticks span:first-child { transform: none; } .tl-ticks span:last-child { transform: translateX(-100%); } .legend { display: flex; flex-wrap: wrap; gap: 16px; margin: 4px 0 16px 82px; font-size: 12px; color: var(--muted); } .leg i, .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; } table.phases { table-layout: fixed; } table.phases th { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; } .ph-name { width: 200px; font-weight: 500; } .ph-job { margin-left: 8px; font-size: 11px; font-weight: 400; color: var(--muted); } .ph-dur { width: 64px; text-align: right; font-variant-numeric: tabular-nums; } .ph-share { width: 120px; } .share { height: 6px; background: var(--fill); border-radius: 3px; overflow: hidden; } .share div { height: 100%; border-radius: 3px; } .ph-cmd code { display: block; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); } .ph-cmd details { margin-top: 4px; } .ph-cmd summary { font-size: 11px; color: var(--muted); cursor: pointer; } .ph-cmd pre { margin: 6px 0 0; padding: 8px 10px; background: var(--fill); border-radius: 6px; white-space: pre-wrap; word-break: break-all; font-size: 11px; max-height: 160px; overflow: auto; }
.stack { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: rgba(127,127,127,.15); margin: 4px 0 8px; }
.stack span { display: block; height: 100%; border-right: 1px solid rgba(0,0,0,.25); }
.dlegend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; margin-bottom: 8px; }
.dlegend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.s-main { background: #3b82f6; } .s-main + .s-main { background: #60a5fa; } .s-main + .s-main + .s-main { background: #93c5fd; }
.s-old { background: #9ca3af; } .s-sess { background: #f59e0b; } .s-cache { background: #10b981; }
#modal-body h2 { margin-top: 18px; }
</style>
</head>
<body>
<main>
  <header><h1>warmd</h1><span class="muted" id="updated"></span></header>
  <section class="grid" id="machine"></section>
  <section class="card"><h2>Repos</h2><table><thead><tr><th>Repo</th><th>State</th><th>Main</th><th>Disk</th><th>Last build</th></tr></thead><tbody id="repos"></tbody></table></section>
  <section class="card"><h2>Running now</h2><table><thead><tr><th>Since</th><th>Repo</th><th>Branch</th><th>Kind</th><th>State</th></tr></thead><tbody id="live"></tbody></table></section>
  <section class="card"><h2>Recent jobs</h2><table><thead><tr><th>When</th><th>Repo</th><th>Branch</th><th>Kind</th><th>Result</th><th>Total</th><th>Slowest phases</th></tr></thead><tbody id="jobs"></tbody></table></section>
</main>
<div id="modal" hidden><div class="sheet"><header><h1 id="modal-title"></h1><button id="modal-close">✕</button></header><div id="modal-body"></div></div></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const gb = b => (b / 1e9).toFixed(b < 1e10 ? 1 : 0) + " GB";
const pct = (a, b) => b ? a * 100 / b : 0;
const dur = s => s == null ? "–" : s < 60 ? s.toFixed(s < 10 ? 1 : 0) + "s" : s < 3600 ? Math.round(s / 60) + "m" : (s / 3600).toFixed(1) + "h";
const ago = t => dur(Date.now() / 1000 - t) + " ago";
const spark = (pts, key) => {
  if (pts.length < 2) return "";
  const w = 300, h = 48, x = i => i * w / (pts.length - 1), y = v => h - 2 - v * (h - 4) / 100;
  const d = pts.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p[key]).toFixed(1)).join(" ");
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none"><path d="' + d + '" fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>';
};
const stat = (label, value, sub, extra = "") => '<div class="card stat"><h2>' + label + '</h2><div class="value">' + value + '</div><div class="sub">' + sub + '</div>' + extra + '</div>';
const cores = list => '<div class="cores">' + list.map((p, i) => '<div title="cpu' + i + ' ' + p.toFixed(0) + '%"><div style="height:' + Math.min(p, 100).toFixed(0) + '%"></div></div>').join("") + '</div>';
const bar = p => '<div class="bar"><div style="width:' + Math.min(p, 100).toFixed(1) + '%"></div></div>';
const dot = s => '<span class="dot ' + esc(s) + '"></span>';
let last = null, open = null, commitLink = () => "";
const size = b => b == null ? "…" : gb(b);
const parts = g => (g.parts || []).map(p => '<span class="chip">[' + p.jobs.map(esc).join(", ") + '] ' + gb(p.bytes) + '</span>').join("");
const kv = (label, value) => value === undefined || value === null || value === "" || (Array.isArray(value) && !value.length) || (typeof value === "object" && !Array.isArray(value) && !Object.keys(value).length) ? "" : '<div class="kv"><span class="muted">' + esc(label) + '</span><span>' + value + '</span></div>';
const chips = list => (list || []).map(x => '<span class="chip">' + esc(x) + '</span>').join("");
const argsHtml = args => Object.entries(args || {}).map(([job, o]) => '<div><b>' + esc(job) + '</b> ' + (o.replace ? 'replace ' + chips(o.replace) : '') + (o.add && o.add.length ? ' add ' + chips(o.add) : '') + '</div>').join("");
const yes = b => b ? "yes" : "";
const time = t => t ? new Date(t * 1000).toLocaleTimeString() : "";
const PHASE_KINDS = [
  { key: "clippy", label: "Clippy", color: "#5b8def", test: n => /clippy/.test(n) },
  { key: "slapslop", label: "slapslop", color: "#9b7bf0", test: n => /slapslop/.test(n) },
  { key: "fmt", label: "rustfmt", color: "#3fb27f", test: n => /fmt/.test(n) },
  { key: "git", label: "Git / copy", color: "#3aa7b8", test: n => /copy|fetch|clone|checkout|submodules|apply|commit/.test(n) },
  { key: "other", label: "Setup", color: "#8a8f98", test: () => true },
];
const phaseKind = name => PHASE_KINDS.find(k => k.test(name));
const phaseColor = name => phaseKind(name).color;
const phaseTitle = name => {
  const [scope, rest] = name.includes(":") ? name.split(/:(.*)/) : ["", name];
  const base = rest || name;
  return scope === "full" ? base + " (full)" : base;
};
function timelineHtml(jobs) {
  const t0 = Math.min(...jobs.map(j => j.start)), t1 = Math.max(...jobs.map(j => j.start + j.total));
  const span = Math.max(t1 - t0, 0.001);
  const lanes = [];
  for (const j of [...jobs].sort((a, b) => a.start - b.start)) {
    let lane = lanes.find(l => l.end <= j.start + 0.01);
    if (!lane) { lane = { end: 0, jobs: [] }; lanes.push(lane); }
    lane.jobs.push(j); lane.end = j.start + j.total;
  }
  const pct = x => (x * 100 / span).toFixed(3) + "%";
  const rows = lanes.map(l => '<div class="tl-row"><div class="tl-name">' + esc(l.jobs.map(j => j.label).join(" · ")) + '</div><div class="tl-track">' +
    l.jobs.map(j => j.phases.filter(p => p.secs > 0).map(p => {
      const w = p.secs / span;
      return '<div class="tl-seg" title="' + esc(phaseTitle(p.name) + " · " + dur(p.secs)) + '" style="left:' + pct(j.start + p.start_secs - t0) + ';width:calc(' + pct(p.secs) + ' - 2px);background:' + phaseColor(p.name) + '">' +
        (w > 0.09 ? '<span>' + esc(phaseTitle(p.name)) + '</span>' : '') + '</div>';
    }).join("")).join("") + '</div></div>').join("");
  const ticks = [0, 0.25, 0.5, 0.75, 1].map(f => '<span style="left:' + (f * 100) + '%">' + dur(span * f) + '</span>').join("");
  const used = new Set(jobs.flatMap(j => j.phases.filter(p => p.secs > 0).map(p => phaseKind(p.name).key)));
  const legend = PHASE_KINDS.filter(k => used.has(k.key)).map(k => '<span class="leg"><i style="background:' + k.color + '"></i>' + k.label + '</span>').join("");
  const total = span;
  const rowsTable = jobs.flatMap(j => j.phases.filter(p => p.secs >= 0.05 || (p.commands || []).length).map(p => {
    const cmds = p.commands || [];
    const main = cmds.length ? cmds[cmds.length - 1].split("\n")[0] : "";
    const more = cmds.length > 1 || (cmds[0] || "").includes("\n");
    return '<tr>' +
      '<td class="ph-name"><i class="sw" style="background:' + phaseColor(p.name) + '"></i>' + esc(phaseTitle(p.name)) + (jobs.length > 1 ? '<span class="ph-job">' + esc(j.label) + '</span>' : '') + '</td>' +
      '<td class="ph-dur">' + dur(p.secs) + '</td>' +
      '<td class="ph-share"><div class="share"><div style="width:' + Math.max(p.secs * 100 / total, 1).toFixed(1) + '%;background:' + phaseColor(p.name) + '"></div></div></td>' +
      '<td class="ph-cmd">' + (main ? '<code title="' + esc(cmds.join("\n\n")) + '">' + esc(main) + '</code>' + (more ? '<details><summary>' + cmds.length + (cmds.length === 1 ? ' command' : ' commands') + '</summary>' + cmds.map(c => '<pre><code>' + esc(c) + '</code></pre>').join("") + '</details>' : '') : '<span class="muted">internal</span>') + '</td>' +
    '</tr>';
  })).join("");
  return '<div class="tl">' + rows + '<div class="tl-row"><div class="tl-name"></div><div class="tl-ticks">' + ticks + '</div></div></div>' +
    '<div class="legend">' + legend + '</div>' +
    '<table class="phases"><thead><tr><th>Phase</th><th class="ph-dur">Time</th><th class="ph-share">Share</th><th>Command</th></tr></thead><tbody>' + rowsTable + '</tbody></table>';
}
function detailHtml(head, f, req, timeline) {
  return '<div class="detail">' +
    '<section><h2>Job</h2>' + head + '</section>' +
    '<section><h2>Request</h2>' +
      kv("Session", esc(req.session || "")) + kv("Full set", yes(req.full || req.full_only)) + kv("Only", chips(req.only)) + kv("Skip", chips(req.skip)) +
      kv("Args", argsHtml(req.args)) + kv("Fix patch", yes(req.fix)) + kv("Own slapslop baseline", yes(req.slapslop_baseline)) +
      kv("Patch", req.patch_lines != null ? req.patch_files + " files, " + req.patch_lines + " lines" : "") +
      (Object.keys(req).length ? "" : '<div class="muted">Not recorded for jobs before this change.</div>') +
    '</section>' +
    (timeline ? '<section><h2>Timeline</h2>' + timeline + '</section>' : '') +
  '</div>';
}
function liveDetail(i) {
  const j = last.live[i];
  if (!j) return;
  open = null;
  $("modal-title").textContent = [j.repo, j.kind, j.branch].filter(Boolean).join(" / ");
  const head = kv("Repo", esc(j.repo)) + kv("Commit", commitLink(j.repo, j.base, true)) + kv("Branch", esc(j.branch || "")) + kv("Kind", esc(j.kind)) +
    kv("Queued at", time(j.started)) + kv("Running", j.running_since ? "since " + time(j.running_since) + " (" + dur(Date.now() / 1000 - j.running_since) + ")" : "queued");
  $("modal-body").innerHTML = detailHtml(head, {}, j.request || {}, "");
  $("modal").hidden = false;
}
function recentDetail(i) {
  const j = last.recent[i];
  if (!j) return;
  open = null;
  const f = j.fields || {};
  $("modal-title").textContent = [f.repo, j.kind, f.branch].filter(Boolean).join(" / ");
  const res = String(f.result ?? (j.kind === "build" ? (f.ok ? "built" : "failed") : ""));
  const head = kv("Repo", esc(f.repo)) + kv("Commit", commitLink(f.repo, f.base || f.sha, f.dirty)) + kv("Ran on", f.ran_on && f.ran_on !== f.base ? commitLink(f.repo, f.ran_on, false) : "") +
    kv("Branch", esc(f.branch || "")) + kv("Kind", esc(j.kind)) + kv("Result", esc(res)) + kv("Finished", new Date(j.at * 1000).toLocaleString()) +
    kv("Total", dur(j.total_secs)) + kv("Layer", f.layer_bytes != null ? size(f.layer_bytes) : "");
  const span = r => ({ start: r.at - r.total_secs, end: r.at });
  const me = span(j);
  const related = last.recent.filter(r => r === j || (r.fields.repo === f.repo && r.fields.base === f.base && (r.fields.branch || null) === (f.branch || null) && span(r).start < me.end && span(r).end > me.start));
  const jobs = related.map(r => ({ label: r.kind, start: r.at - r.total_secs, total: r.total_secs, phases: (r.phases || []).map(p => ({ start_secs: 0, commands: [], ...p })) }));
  for (const job of jobs) if (job.phases.every(p => !p.start_secs)) { let t = 0; for (const p of job.phases) { p.start_secs = t; t += p.secs; } }
  $("modal-body").innerHTML = detailHtml(head, f, f.request || {}, jobs.some(x => x.phases.length) ? timelineHtml(jobs) : "");
  $("modal").hidden = false;
}
function tree(i) {
  open = i;
  const r = last.repos[i], v = r.view, gens = [...v.gens].reverse(), main = gens[0], older = gens.slice(1);
  const sessions = v.sessions || [];
  const checks = r.checks.filter(c => c.kind === "check" || c.kind === "full" || c.kind === "slapslop_baseline").reverse().slice(0, 15);
  const label = p => p.jobs.includes("source") ? "source" : p.jobs.includes("slapslop") ? "slapslop target" : p.jobs.length === 1 && p.jobs[0] === "fmt" ? "fmt" : "cargo target (" + p.jobs.join(", ") + ")";
  const mainParts = (main?.parts || []).filter(p => p.bytes > 0).sort((a, b) => b.bytes - a.bytes);
  const segs = [
    ...mainParts.map(p => ({ name: "main · " + label(p), bytes: p.bytes, cls: "s-main" })),
    { name: "older builds", bytes: older.reduce((s, g) => s + (g.own_bytes || 0), 0), cls: "s-old" },
    { name: "sessions (" + sessions.length + ")", bytes: sessions.reduce((s, x) => s + (x.bytes || 0), 0), cls: "s-sess" },
    { name: "build cache", bytes: v.cache_bytes || 0, cls: "s-cache" },
  ].filter(s => s.bytes > 0);
  const total = segs.reduce((s, x) => s + x.bytes, 0);
  const stack = '<div class="stack">' + segs.map(s => '<span class="' + s.cls + '" style="width:' + Math.max(pct(s.bytes, total), 0.5) + '%" title="' + esc(s.name) + ' ' + gb(s.bytes) + '"></span>').join("") + '</div>';
  const legend = '<div class="dlegend">' + segs.map(s => '<span><i class="' + s.cls + '"></i>' + esc(s.name) + ' <b>' + gb(s.bytes) + '</b></span>').join("") + '</div>';
  const table = (head, rows, empty) => '<table><thead><tr>' + head.map(h => '<th>' + h + '</th>').join("") + '</tr></thead><tbody>' + (rows.join("") || '<tr><td colspan="' + head.length + '" class="muted">' + empty + '</td></tr>') + '</tbody></table>';
  const td = (...cells) => '<tr>' + cells.map(c => '<td>' + c + '</td>').join("") + '</tr>';
  const commit = sha => commitLink(r.name, sha, false);
  const mainSec = main ? '<h2>Main build</h2><p class="muted">' + commit(main.sha) + ' · ' + dur(main.age_secs) + ' old · ' + size(main.bytes) + ' · shared by every check, never expires while it is main</p>' +
    table(["Part", "Size"], mainParts.map(p => td(esc(label(p)), gb(p.bytes))), "not measured yet") : '<h2>Main build</h2><p class="muted">none yet</p>';
  const oldSec = '<h2>Older builds</h2>' + table(["Commit", "Own size", "Age", "Deleted in"], older.map(g => td(commit(g.sha), size(g.own_bytes), dur(g.age_secs), dur(g.expires_in_secs))), "none: only main is kept");
  const sessSec = '<h2>Sessions</h2><p class="muted">One per branch: its own changes and build outputs on top of main. Deleted after 30 min idle or when main moves.</p>' +
    table(["Branch", "Size", "Idle", "Deleted in", "Base"], sessions.map(s => td(esc(s.name), size(s.bytes), dur(s.idle_secs), dur(s.expires_in_secs), s.on_main ? "main" : '<span class="muted">older build</span>')), "no live sessions");
  const checkSec = '<h2>Recent checks</h2>' + table(["Branch", "Kind", "Result", "Layer", "Took", "When"], checks.map(c => {
    const f = c.fields, res = String(f.result ?? "");
    const cls = res.startsWith("failed") ? "failed" : res === "ok" || res === "baseline" ? "ok" : "refreshing";
    return td(f.branch ? esc(f.branch) : f.base ? commit(f.base) : "–", esc(c.kind), dot(cls) + esc(res.slice(0, 50)), size(f.layer_bytes), dur(c.total_secs), ago(c.at));
  }), "none");
  $("modal-title").textContent = r.name + " · " + gb(total) + " on disk";
  $("modal-body").innerHTML = stack + legend + mainSec + oldSec + sessSec + checkSec;
  $("modal").hidden = false;
}
function closeTree() { open = null; $("modal").hidden = true; }
document.addEventListener("click", e => {
  const row = e.target.closest("tr.click");
  if (e.target.closest("a")) return;
  if (row && row.dataset.live != null) liveDetail(Number(row.dataset.live));
  else if (row && row.dataset.recent != null) recentDetail(Number(row.dataset.recent));
  else if (row) tree(Number(row.dataset.repo));
  else if (e.target.id === "modal" || e.target.id === "modal-close") closeTree();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeTree(); });
async function load() {
  const s = await (await fetch("/stats")).json();
  const m = s.machine, now = m.now || { cpu: 0, mem: 0 };
  $("machine").innerHTML =
    stat("CPU · " + m.cores + " threads", now.cpu.toFixed(0) + "%", esc(m.cpu_model) + "<br>peak 24h " + m.peak_cpu.toFixed(0) + "% · load " + m.load.map(l => l.toFixed(1)).join(" "), cores(m.cpu_per_core) + spark(m.history, "cpu")) +
    stat("Memory", gb(m.mem_used), "of " + gb(m.mem_total) + " · peak 24h " + m.peak_mem.toFixed(0) + "%", spark(m.history, "mem")) +
    m.disks.map(d => stat("Disk " + esc(d.mount), pct(d.used, d.size).toFixed(0) + "%", gb(d.used) + " of " + gb(d.size), bar(pct(d.used, d.size)))).join("") +
    stat("Jobs", s.jobs.running + s.jobs.queued, s.jobs.running + " running · " + s.jobs.queued + " queued · " + s.jobs.done + " done · " + s.jobs.failed + " failed");
  last = s;
  $("repos").innerHTML = s.repos.map((r, i) => {
    const v = r.view, st = v.status, b = r.last_build;
    const main = v.gens[v.gens.length - 1];
    const link = main ? (/^https:/.test(r.url) ? '<a href="' + esc(r.url) + '/commit/' + esc(main.sha) + '" target="_blank" onclick="event.stopPropagation()"><code>' + esc(main.sha.slice(0, 7)) + '</code></a>' : '<code>' + esc(main.sha.slice(0, 7)) + '</code>') + ' <span class="muted">' + dur(main.age_secs) + ' old</span>' : '<span class="muted">none</span>';
    const total = v.gens.reduce((sum, g) => sum + (g.expires_in_secs == null ? g.bytes || 0 : g.own_bytes || 0), 0);
    const disk = main ? size(main.bytes) + (v.gens.length > 1 ? ' <span class="muted">· ' + gb(total) + ' with ' + (v.gens.length - 1) + ' older</span>' : '') : '–';
    const build = b ? dur(b.total_secs) + ' <span class="muted">' + ago(b.at) + (b.fields.ok ? "" : " · failed") + '</span>' : '<span class="muted">–</span>';
    return '<tr class="click" data-repo="' + i + '"><td><b>' + esc(r.name) + '</b></td><td>' + dot(st.state) + esc(st.state) + (st.error ? '<div class="muted">' + esc(st.error.slice(-160)) + '</div>' : "") + '</td><td>' + link + '</td><td>' + disk + '</td><td>' + build + '</td></tr>';
  }).join("");
  if (open != null) tree(open);
  commitLink = (repoName, sha, dirty) => {
    const repo = last.repos.find(r => r.name === repoName);
    const label = '<code>' + esc(String(sha).slice(0, 7)) + (dirty ? '-dirty' : '') + '</code>';
    return sha && repo && /^https:/.test(repo.url) ? '<a href="' + esc(repo.url) + '/commit/' + esc(sha) + '" target="_blank">' + label + '</a>' : label;
  };
  const liveRows = (s.building || []).map(b => '<tr><td class="muted">' + dur(Date.now() / 1000 - b.started) + '</td><td>' + esc(b.repo) + '</td><td>' + commitLink(b.repo, b.sha, false) + '</td><td>build</td><td class="muted">main</td><td>' + dot("refreshing") + 'building</td></tr>')
    .concat((s.live || []).map((j, i) => '<tr class="click" data-live="' + i + '"><td class="muted">' + dur(Date.now() / 1000 - j.started) + '</td><td>' + esc(j.repo) + '</td><td>' + (j.branch ? esc(j.branch) : commitLink(j.repo, j.base, false)) + '</td><td>' + esc(j.kind) + '</td><td>' + dot(j.running_since ? "refreshing" : "queued") + (j.running_since ? 'running ' + dur(Date.now() / 1000 - j.running_since) : 'queued') + '</td></tr>'));
  $("live").innerHTML = liveRows.join("") || '<tr><td colspan="5" class="muted">Nothing running</td></tr>';
  $("jobs").innerHTML = s.recent.map((j, i) => {
    const slow = [...j.phases].sort((a, b) => b.secs - a.secs).slice(0, 3).map(p => '<span class="chip">' + esc(p.name) + ' ' + dur(p.secs) + '</span>').join("");
    const res = String(j.fields.result ?? (j.kind === "build" ? (j.fields.ok ? "built" : "failed") : j.fields.ok ? "ok" : "failed"));
    const cls = res.startsWith("failed") ? "failed" : res === "ok" || res === "baseline" || res === "built" ? "ok" : "refreshing";
    const repo = last.repos.find(r => r.name === j.fields.repo), sha = String(j.fields.base ?? j.fields.sha ?? "");
    const label = sha ? '<code>' + esc(sha.slice(0, 7)) + (j.fields.dirty ? '-dirty' : '') + '</code>' : '<span class="muted">–</span>';
    const commit = sha && repo && /^https:/.test(repo.url) ? '<a href="' + esc(repo.url) + '/commit/' + esc(sha) + '" target="_blank">' + label + '</a>' : label;
    return '<tr class="click" data-recent="' + i + '"><td class="muted">' + ago(j.at) + '</td><td>' + esc(j.fields.repo) + '</td><td>' + (j.fields.branch ? esc(j.fields.branch) : commit) + '</td><td>' + esc(j.kind) + '</td><td>' + dot(cls) + esc(res.slice(0, 60)) + '</td><td>' + dur(j.total_secs) + '</td><td>' + slow + '</td></tr>';
  }).join("") || '<tr><td colspan="7" class="muted">No jobs yet</td></tr>';
  $("updated").textContent = "updated " + new Date().toLocaleTimeString();
}
load(); setInterval(load, 5000);
</script>
</body>
