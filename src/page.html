<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>warmd</title>
<style>
:root {
  --bg: #f4f4f4; --surface: #fff; --line: rgba(0,0,0,.08); --text: #000; --muted: rgba(0,0,0,.55); --faint: rgba(0,0,0,.35);
  --fill: rgba(0,0,0,.06); --positive: #138a3e; --warning: #c56a00; --negative: #d12f2f;
  font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-feature-settings: "tnum";
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #000; --surface: #111; --line: rgba(255,255,255,.1); --text: #fff; --muted: rgba(255,255,255,.6); --faint: rgba(255,255,255,.35); --fill: rgba(255,255,255,.08); --positive: #3ccf6e; --warning: #ffa23a; --negative: #ff5c5c; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-size: 13px; }
main { max-width: 1100px; margin: 0 auto; padding: 32px 20px; display: grid; gap: 16px; }
header { display: flex; align-items: baseline; justify-content: space-between; }
h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
h2 { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.stat .value { font-size: 24px; font-weight: 600; letter-spacing: -.02em; }
.stat .sub { color: var(--muted); margin-top: 2px; }
.bar { height: 4px; background: var(--fill); border-radius: 2px; margin-top: 10px; overflow: hidden; }
.bar > div { height: 100%; background: var(--text); }
svg { width: 100%; height: 48px; display: block; margin-top: 10px; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 500; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
code { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; }
.muted { color: var(--muted); }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; background: var(--faint); }
.ready, .ok { background: var(--positive); } .refreshing, .running, .queued { background: var(--warning); } .failed { background: var(--negative); }
.cores { display: flex; gap: 2px; height: 24px; margin-top: 10px; align-items: flex-end; }
.cores > div { flex: 1; height: 100%; background: var(--fill); border-radius: 1px; display: flex; align-items: flex-end; }
.cores > div > div { width: 100%; background: var(--text); border-radius: 1px; }
.chip { display: inline-block; padding: 1px 6px; border-radius: 6px; background: var(--fill); margin: 0 4px 4px 0; }
tr.click { cursor: pointer; } a { color: inherit; } a:hover code { text-decoration: underline; } tr.click:hover td { background: var(--fill); }
#modal { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; }
#modal[hidden] { display: none; }
.sheet { width: 80vw; height: 80vh; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px 24px; overflow: auto; }
.sheet header { margin-bottom: 16px; }
.sheet button { background: none; border: 0; color: var(--muted); font-size: 16px; cursor: pointer; }
.tree, .tree ul { list-style: none; margin: 0; padding-left: 18px; }
.tree { padding-left: 0; }
.tree li { position: relative; padding: 4px 0 4px 14px; }
.tree ul li::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; border-left: 1px solid var(--line); }
.tree ul li::after { content: ""; position: absolute; left: 0; top: 13px; width: 10px; border-top: 1px solid var(--line); }
.node { font-weight: 500; }
.parts { margin: 4px 0 0; font-size: 12px; }
</style>
</head>
<body>
<main>
  <header><h1>warmd</h1><span class="muted" id="updated"></span></header>
  <section class="grid" id="machine"></section>
  <section class="card"><h2>Repos</h2><table><thead><tr><th>Repo</th><th>State</th><th>Main</th><th>Disk</th><th>Last build</th></tr></thead><tbody id="repos"></tbody></table></section>
  <section class="card"><h2>Running now</h2><table><thead><tr><th>Since</th><th>Repo</th><th>Commit</th><th>Kind</th><th>Branch</th><th>State</th></tr></thead><tbody id="live"></tbody></table></section>
  <section class="card"><h2>Recent jobs</h2><table><thead><tr><th>When</th><th>Repo</th><th>Commit</th><th>Kind</th><th>Result</th><th>Total</th><th>Slowest phases</th></tr></thead><tbody id="jobs"></tbody></table></section>
</main>
<div id="modal" hidden><div class="sheet"><header><h1 id="modal-title"></h1><button id="modal-close">✕</button></header><div id="modal-body"></div></div></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const gb = b => (b / 1e9).toFixed(b < 1e10 ? 1 : 0) + " GB";
const pct = (a, b) => b ? a * 100 / b : 0;
const dur = s => s == null ? "–" : s < 60 ? s.toFixed(s < 10 ? 1 : 0) + "s" : s < 3600 ? Math.round(s / 60) + "m" : (s / 3600).toFixed(1) + "h";
const ago = t => dur(Date.now() / 1000 - t) + " ago";
const spark = (pts, key) => {
  if (pts.length < 2) return "";
  const w = 300, h = 48, x = i => i * w / (pts.length - 1), y = v => h - 2 - v * (h - 4) / 100;
  const d = pts.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p[key]).toFixed(1)).join(" ");
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none"><path d="' + d + '" fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>';
};
const stat = (label, value, sub, extra = "") => '<div class="card stat"><h2>' + label + '</h2><div class="value">' + value + '</div><div class="sub">' + sub + '</div>' + extra + '</div>';
const cores = list => '<div class="cores">' + list.map((p, i) => '<div title="cpu' + i + ' ' + p.toFixed(0) + '%"><div style="height:' + Math.min(p, 100).toFixed(0) + '%"></div></div>').join("") + '</div>';
const bar = p => '<div class="bar"><div style="width:' + Math.min(p, 100).toFixed(1) + '%"></div></div>';
const dot = s => '<span class="dot ' + esc(s) + '"></span>';
let last = null, open = null;
const size = b => b == null ? "…" : gb(b);
const parts = g => (g.parts || []).map(p => '<span class="chip">[' + p.jobs.map(esc).join(", ") + '] ' + gb(p.bytes) + '</span>').join("");
function tree(i) {
  open = i;
  const r = last.repos[i], gens = [...r.view.gens].reverse();
  const checks = r.checks.filter(c => c.kind === "check" || c.kind === "slapslop_baseline").reverse();
  const shown = new Set();
  const node = (label, meta, cls) => '<li><span class="node">' + (cls ? dot(cls) : "") + label + '</span> <span class="muted">' + meta + '</span>';
  const checkNode = c => {
    const f = c.fields, res = String(f.result ?? "");
    const name = f.branch ? esc(f.branch) : f.base ? 'base <code>' + esc(String(f.base).slice(0, 7)) + '</code>' : 'check';
    const cls = res.startsWith("failed") ? "failed" : res === "ok" || res === "baseline" || res === "built" ? "ok" : "refreshing";
    return node(name, esc(res.slice(0, 80)) + ' · ' + size(f.layer_bytes) + ' · ' + dur(c.total_secs) + ' · ' + ago(c.at), cls) + '</li>';
  };
  const items = gens.map((g, n) => {
    const own = checks.filter(c => c.fields.ran_on === g.sha);
    own.forEach(c => shown.add(c));
    const label = (n === 0 ? '<b>main</b> ' : '') + '<code>' + esc(g.sha.slice(0, 7)) + '</code>';
    const meta = (n === 0 ? size(g.bytes) : '+' + size(g.own_bytes) + ' · TTL ' + dur(g.expires_in_secs)) + ' · ' + dur(g.age_secs) + ' old';
    return node(label, meta, n === 0 ? "ready" : "") + '<div class="parts">' + parts(g) + '</div>' + (own.length ? '<ul>' + own.map(checkNode).join("") + '</ul>' : "") + '</li>';
  }).join("");
  const other = checks.filter(c => !shown.has(c));
  $("modal-title").textContent = r.name;
  $("modal-body").innerHTML = '<ul class="tree">' + items + '</ul>' + (other.length ? '<h2 style="margin-top:20px">Checks on deleted builds</h2><ul class="tree">' + other.map(checkNode).join("") + '</ul>' : "");
  $("modal").hidden = false;
}
function closeTree() { open = null; $("modal").hidden = true; }
function liveDetail(i) {
  const j = last.live[i];
  if (!j) return;
  open = null;
  $("modal-title").textContent = [j.repo, j.kind, j.branch].filter(Boolean).join(" / ");
  $("modal-body").innerHTML = '<pre style="white-space:pre-wrap"><code>' + esc(JSON.stringify({ base: j.base, started: new Date(j.started * 1000).toLocaleTimeString(), running_since: j.running_since && new Date(j.running_since * 1000).toLocaleTimeString(), ...j.request }, null, 2)) + '</code></pre>';
  $("modal").hidden = false;
}
function recentDetail(i) {
  const j = last.recent[i];
  if (!j) return;
  open = null;
  $("modal-title").textContent = [j.fields.repo, j.kind, j.fields.branch].filter(Boolean).join(" / ");
  $("modal-body").innerHTML = '<pre style="white-space:pre-wrap"><code>' + esc(JSON.stringify({ at: new Date(j.at * 1000).toLocaleString(), total_secs: j.total_secs, ...j.fields, phases: j.phases }, null, 2)) + '</code></pre>';
  $("modal").hidden = false;
}
document.addEventListener("click", e => {
  const row = e.target.closest("tr.click");
  if (e.target.closest("a")) return;
  if (row && row.dataset.live != null) liveDetail(Number(row.dataset.live));
  else if (row && row.dataset.recent != null) recentDetail(Number(row.dataset.recent));
  else if (row) tree(Number(row.dataset.repo));
  else if (e.target.id === "modal" || e.target.id === "modal-close") closeTree();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeTree(); });
async function load() {
  const s = await (await fetch("/stats")).json();
  const m = s.machine, now = m.now || { cpu: 0, mem: 0 };
  $("machine").innerHTML =
    stat("CPU · " + m.cores + " threads", now.cpu.toFixed(0) + "%", esc(m.cpu_model) + "<br>peak 24h " + m.peak_cpu.toFixed(0) + "% · load " + m.load.map(l => l.toFixed(1)).join(" "), cores(m.cpu_per_core) + spark(m.history, "cpu")) +
    stat("Memory", gb(m.mem_used), "of " + gb(m.mem_total) + " · peak 24h " + m.peak_mem.toFixed(0) + "%", spark(m.history, "mem")) +
    m.disks.map(d => stat("Disk " + esc(d.mount), pct(d.used, d.size).toFixed(0) + "%", gb(d.used) + " of " + gb(d.size), bar(pct(d.used, d.size)))).join("") +
    stat("Jobs", s.jobs.running + s.jobs.queued, s.jobs.running + " running · " + s.jobs.queued + " queued · " + s.jobs.done + " done · " + s.jobs.failed + " failed");
  last = s;
  $("repos").innerHTML = s.repos.map((r, i) => {
    const v = r.view, st = v.status, b = r.last_build;
    const main = v.gens[v.gens.length - 1];
    const link = main ? (/^https:/.test(r.url) ? '<a href="' + esc(r.url) + '/commit/' + esc(main.sha) + '" target="_blank" onclick="event.stopPropagation()"><code>' + esc(main.sha.slice(0, 7)) + '</code></a>' : '<code>' + esc(main.sha.slice(0, 7)) + '</code>') + ' <span class="muted">' + dur(main.age_secs) + ' old</span>' : '<span class="muted">none</span>';
    const total = v.gens.reduce((sum, g) => sum + (g.expires_in_secs == null ? g.bytes || 0 : g.own_bytes || 0), 0);
    const disk = main ? size(main.bytes) + (v.gens.length > 1 ? ' <span class="muted">· ' + gb(total) + ' with ' + (v.gens.length - 1) + ' older</span>' : '') : '–';
    const build = b ? dur(b.total_secs) + ' <span class="muted">' + ago(b.at) + (b.fields.ok ? "" : " · failed") + '</span>' : '<span class="muted">–</span>';
    return '<tr class="click" data-repo="' + i + '"><td><b>' + esc(r.name) + '</b></td><td>' + dot(st.state) + esc(st.state) + (st.error ? '<div class="muted">' + esc(st.error.slice(-160)) + '</div>' : "") + '</td><td>' + link + '</td><td>' + disk + '</td><td>' + build + '</td></tr>';
  }).join("");
  if (open != null) tree(open);
  const commitLink = (repoName, sha, dirty) => {
    const repo = last.repos.find(r => r.name === repoName);
    const label = '<code>' + esc(String(sha).slice(0, 7)) + (dirty ? '-dirty' : '') + '</code>';
    return sha && repo && /^https:/.test(repo.url) ? '<a href="' + esc(repo.url) + '/commit/' + esc(sha) + '" target="_blank">' + label + '</a>' : label;
  };
  const liveRows = (s.building || []).map(b => '<tr><td class="muted">' + dur(Date.now() / 1000 - b.started) + '</td><td>' + esc(b.repo) + '</td><td>' + commitLink(b.repo, b.sha, false) + '</td><td>build</td><td class="muted">main</td><td>' + dot("refreshing") + 'building</td></tr>')
    .concat((s.live || []).map((j, i) => '<tr class="click" data-live="' + i + '"><td class="muted">' + dur(Date.now() / 1000 - j.started) + '</td><td>' + esc(j.repo) + '</td><td>' + commitLink(j.repo, j.base, true) + '</td><td>' + esc(j.kind) + '</td><td>' + esc(j.branch || "–") + '</td><td>' + dot(j.running_since ? "refreshing" : "queued") + (j.running_since ? 'running ' + dur(Date.now() / 1000 - j.running_since) : 'queued') + '</td></tr>'));
  $("live").innerHTML = liveRows.join("") || '<tr><td colspan="6" class="muted">Nothing running</td></tr>';
  $("jobs").innerHTML = s.recent.map((j, i) => {
    const slow = [...j.phases].sort((a, b) => b.secs - a.secs).slice(0, 3).map(p => '<span class="chip">' + esc(p.name) + ' ' + dur(p.secs) + '</span>').join("");
    const res = String(j.fields.result ?? (j.kind === "build" ? (j.fields.ok ? "built" : "failed") : j.fields.ok ? "ok" : "failed"));
    const cls = res.startsWith("failed") ? "failed" : res === "ok" || res === "baseline" || res === "built" ? "ok" : "refreshing";
    const repo = last.repos.find(r => r.name === j.fields.repo), sha = String(j.fields.base ?? j.fields.sha ?? "");
    const label = sha ? '<code>' + esc(sha.slice(0, 7)) + (j.fields.dirty ? '-dirty' : '') + '</code>' : '<span class="muted">–</span>';
    const commit = sha && repo && /^https:/.test(repo.url) ? '<a href="' + esc(repo.url) + '/commit/' + esc(sha) + '" target="_blank">' + label + '</a>' : label;
    return '<tr class="click" data-recent="' + i + '"><td class="muted">' + ago(j.at) + '</td><td>' + esc(j.fields.repo) + '</td><td>' + commit + '</td><td>' + esc(j.kind) + '</td><td>' + dot(cls) + esc(res.slice(0, 60)) + '</td><td>' + dur(j.total_secs) + '</td><td>' + slow + '</td></tr>';
  }).join("") || '<tr><td colspan="7" class="muted">No jobs yet</td></tr>';
  $("updated").textContent = "updated " + new Date().toLocaleTimeString();
}
load(); setInterval(load, 5000);
</script>
</body>
</html>
