[workspace]

[package]
name = "warmd"
version = "0.1.0"
edition = "2024"
publish = false
description = "Keeps repos' main built and lints patches against it"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
fiemap = "0.2"
libc = "0.2.191"
ra_ap_hir = "=0.0.358"
ra_ap_ide = "=0.0.358"
ra_ap_ide_db = "=0.0.358"
ra_ap_load-cargo = "=0.0.358"
ra_ap_paths = "=0.0.358"
ra_ap_proc_macro_api = "=0.0.358"
ra_ap_project_model = "=0.0.358"
ra_ap_syntax = "=0.0.358"
ra_ap_vfs = "=0.0.358"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.9"
uuid = { version = "1", features = ["serde", "v4"] }

[lints]
workspace = true

[workspace.lints.clippy]
# the default groups; priority -1 lets the lines below win
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }

# TigerBeetle-derived, see slapslop docs/clippy-recommended.md
if_not_else = "deny"
manual_assert = "deny"
manual_assert_eq = "deny"
match_wildcard_for_single_variants = "deny"
match_wild_err_arm = "deny"
unused_result_ok = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
unnecessary_wraps = "deny"
option_option = "deny"
fn_params_excessive_bools = "deny"
large_stack_arrays = "deny"
large_futures = "deny"
large_types_passed_by_value = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_lossless = "deny"
checked_conversions = "deny"

# Microsoft guidelines, see the section above
empty_drop = "deny"
unnecessary_safety_doc = "deny"
unnecessary_safety_comment = "deny"
fn_to_numeric_cast_any = "deny"
as_pointer_underscore = "deny"
empty_structs_with_brackets = "deny"
empty_enum_variants_with_brackets = "deny"
unneeded_field_pattern = "deny"
redundant_type_annotations = "deny"
renamed_function_params = "deny"
disallowed_script_idents = "deny"
wildcard_imports = "deny"
unused_async = "deny"

# review of AI-written code
unused_self = "deny"
needless_pass_by_ref_mut = "deny"
match_same_arms = "deny"
map_unwrap_or = "deny"
redundant_closure_for_method_calls = "deny"
manual_let_else = "deny"
single_match_else = "deny"
allow_attributes = "deny"
module_name_repetitions = "deny"

# baseline: the pedantic, nursery, restriction and cargo picks
assert_is_empty = "deny"
assigning_clones = "deny"
bool_to_int_with_if = "deny"
